<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetVitals - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container header-inner">
        <h1 class="logo">PetVitals 🐾</h1>
        <nav class="site-nav">
          <a href="index.html" class="active">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="history.html">History</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h2>Keep your pet healthy, one log at a time</h2>
        <p class="lead">Track your dog or cat's weight, meals, and calories, just like a fitness tracker for your pet.</p>
        <p>
          <a class="github-callout" href="https://github.com/ZiegenF/startup">View the code on GitHub →</a>
        </p>
      </section>

      <!-- Authentication placeholder: will connect to the backend later -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <form class="pv-card" method="get" action="dashboard.html">
            <h2 class="h4 mb-3">Login</h2>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" class="form-control" placeholder="your@email.com" />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" placeholder="password" />
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-pv flex-fill">Login</button>
              <button type="submit" class="btn btn-outline-secondary flex-fill">Create account</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <p class="mb-1">Ziegen Farley</p>
      <a href="https://github.com/ZiegenF/startup">GitHub</a>
    </footer>
  </body>
</html>
