<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetVitals - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container header-inner">
        <h1 class="logo">PetVitals 🐾</h1>
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="history.html">History</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>

    <main class="container py-4">
      <!-- Shows the logged-in user's name (authentication) -->
      <p class="user-badge">Logged in as: <strong>username</strong></p>

      <div class="dashboard-grid mt-3">
        <!-- Left column -->
        <div class="d-flex flex-column gap-4">
          <!-- Application data: the user's pets -->
          <section class="pv-card">
            <h2 class="h4">My Pets</h2>
            <label for="pet" class="form-label">Choose a pet:</label>
            <select id="pet" class="form-select mb-3">
              <option>Bella (Dog)</option>
              <option>Whiskers (Cat)</option>
            </select>

            <!-- Third-party API placeholder: breed info from a public breed API -->
            <h3 class="h5">Breed Info</h3>
            <p class="breed-info mb-0">Labrador Retriever: typical weight 55–80 lbs (from breed API)</p>
          </section>

          <!-- Application data: log a new entry -->
          <section class="pv-card">
            <h2 class="h4">Log Today</h2>
            <form>
              <div class="row g-3">
                <div class="col-12 col-sm-4">
                  <label for="weight" class="form-label">Weight (lbs)</label>
                  <input type="number" id="weight" class="form-control" />
                </div>
                <div class="col-12 col-sm-4">
                  <label for="meal" class="form-label">Meal</label>
                  <input type="text" id="meal" class="form-control" placeholder="1 cup dry food" />
                </div>
                <div class="col-12 col-sm-4">
                  <label for="calories" class="form-label">Calories</label>
                  <input type="number" id="calories" class="form-control" />
                </div>
              </div>
              <button type="submit" class="btn btn-pv mt-3">Save Entry</button>
            </form>
          </section>
        </div>

        <!-- Right column: WebSocket placeholder, live updates from other users -->
        <section id="live-activity" class="pv-card">
          <h2 class="h4">Live Activity</h2>
          <ul class="list-unstyled mb-0">
            <li>🐕 A user just logged a weight entry for their dog</li>
            <li>🐈 A user just logged a meal for their cat</li>
          </ul>
        </section>
      </div>
    </main>

    <footer>
      <p class="mb-1">Ziegen Farley</p>
      <a href="https://github.com/ZiegenF/startup">GitHub</a>
    </footer>
  </body>
</html>
