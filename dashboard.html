<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetVitals - Dashboard</title>
  </head>
  <body>
    <header>
      <h1>PetVitals 🐾</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="about.html">About</a>
      </nav>
      <hr />
    </header>

    <main>
      <!-- Shows the logged-in user's name (authentication) -->
      <p>Logged in as: <span>username</span></p>

      <!-- Application data: the user's pets -->
      <h2>My Pets</h2>
      <label for="pet">Choose a pet:</label>
      <select id="pet">
        <option>Bella (Dog)</option>
        <option>Whiskers (Cat)</option>
      </select>

      <!-- Third-party API placeholder: breed info from a public breed API -->
      <h3>Breed Info</h3>
      <p>Labrador Retriever: typical weight 55–80 lbs (from breed API)</p>

      <!-- Application data: log a new entry -->
      <h2>Log Today</h2>
      <form>
        <label for="weight">Weight (lbs)</label>
        <input type="number" id="weight" />
        <br />
        <label for="meal">Meal</label>
        <input type="text" id="meal" placeholder="1 cup dry food" />
        <br />
        <label for="calories">Calories</label>
        <input type="number" id="calories" />
        <br />
        <button type="submit">Save Entry</button>
      </form>

      <!-- WebSocket placeholder: live updates from other users -->
      <h2>Live Activity</h2>
      <ul>
        <li>A user just logged a weight entry for their dog</li>
        <li>A user just logged a meal for their cat</li>
      </ul>
    </main>

    <footer>
      <hr />
      <p>Ziegen Farley</p>
      <a href="https://github.com/ZiegenF/startup">GitHub</a>
    </footer>
  </body>
</html>
